<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التسجيل - BLS Oran</title>
<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
.container{max-width:500px;margin:auto;background:white;padding:25px;border-radius:15px;box-shadow:0 2px 10px #ccc}
h2{text-align:center;color:#1a7a3a}
label{font-weight:bold;display:block;margin-top:15px}
input,select{width:100%;padding:12px;margin-top:5px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:13px;margin-top:20px;background:#1a7a3a;color:white;border:none;border-radius:8px;font-size:16px;font-weight:bold}
#msg{text-align:center;margin-top:15px;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h2>تسجيل جديد - BLS Oran</h2>
<form id="form">
<label>الاسم الكامل</label>
<input type="text" id="name" required>
<label>رقم الهاتف</label>
<input type="tel" id="phone" required>
<label>الولاية</label>
<input type="text" id="wilaya" value="Oran" required>
<label>البلدية</label>
<input type="text" id="commune" required>
<button type="submit">إرسال التسجيل</button>
</form>
<div id="msg"></div>
</div>
<script>
const TOKEN = "8810366366:AAFqb3wl6bCkYCrrsNJGSuABwRYD9VjZhRc";
const CHAT_ID = "6002024244";
document.getElementById('form').addEventListener('submit', async function(e){
e.preventDefault();
let name=document.getElementById('name').value;
let phone=document.getElementById('phone').value;
let wilaya=document.getElementById('wilaya').value;
let commune=document.getElementById('commune').value;
let text=`تسجيل جديد:\nالاسم: ${name}\nالهاتف: ${phone}\nالولاية: ${wilaya}\nالبلدية: ${commune}`;
document.getElementById('msg').innerText="جاري الإرسال...";
try{
let res=await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CHAT_ID,text:text})});
if(res.ok){document.getElementById('msg').innerText="تم التسجيل بنجاح ✅";document.getElementById('msg').style.color="green";}
else{document.getElementById('msg').innerText="خطأ في الإرسال";}}
catch(err){document.getElementById('msg').innerText="خطأ في الاتصال";}
});
</script>
</body>
</html>
