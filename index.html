<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLS Oran 3 - FINAL</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,Arial;background:#0f172a;color:#fff;padding:12px;margin:0;text-align:center}
.card{background:#1e293b;border-radius:18px;padding:20px;max-width:520px;margin:auto}
h1{font-size:22px;margin:5px 0}
.status{padding:14px;border-radius:12px;background:#334155;margin:15px 0;font-size:17px;font-weight:bold}
.status.ok{background:#16a34a}
.status.err{background:#dc2626}
.status.work{background:#eab308;color:#000}
.row{display:flex;gap:8px;justify-content:center;margin:10px 0;font-size:14px}
.box{background:#0f172a;padding:10px;border-radius:10px;flex:1}
input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;text-align:left;direction:ltr}
button{width:100%;padding:14px;margin:6px 0;border:none;border-radius:12px;font-size:16px;font-weight:bold;cursor:pointer}
.start{background:#22c55e;color:#fff}.stop{background:#ef4444;color:#fff}.test{background:#3b82f6;color:#fff}
#log{background:#000;color:#a7f3d0;text-align:left;direction:ltr;padding:12px;border-radius:12px;height:300px;overflow-y:auto;font-size:13px;line-height:1.7}
</style>
</head>
<body>
<div class="card">
<h1>🔍 BLS Oran 3 - FINAL</h1>
<div id="status" class="status">⏸️ متوقف</div>
<div class="row">
<div class="box">فحص: <b id="count">0</b></div>
<div class="box">آخر: <span id="last">-</span></div>
</div>
<input id="token" placeholder="حط التوكن الكامل من BotFather هنا" value="">
<input id="chatId" placeholder="Chat ID" value="6002024244">
<input id="blsUrl" placeholder="https://bls-algeria.com/" value="https://bls-algeria.com/">
<button class="start" onclick="startCheck()">▶️ بدء الفحص</button>
<button class="stop" onclick="stopCheck()">⏹️ إيقاف</button>
<button class="test" onclick="testTelegram()">📩 تجربة Telegram</button>
<div id="log"></div>
</div>

<script>
const tokenInput=document.getElementById('token');
const chatInput=document.getElementById('chatId');
const urlInput=document.getElementById('blsUrl');

if(localStorage.getItem('bls_token')) tokenInput.value=localStorage.getItem('bls_token');
tokenInput.oninput=()=>localStorage.setItem('bls_token',tokenInput.value.trim());

let interval=null,count=0,lastNotified=false;

function addLog(m,color=''){
  const log=document.getElementById('log');
  log.innerHTML+=`<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${m}</div>`;
  log.scrollTop=log.scrollHeight;
}
function setStatus(txt,cls){
  const s=document.getElementById('status');
  s.innerText=txt; s.className='status '+cls;
}
function cleanUrl(u){
  u=u.trim().replace(/^\/+/,'');
  if(!u.startsWith('http')) u='https://'+u;
  return u;
}
async function sendTelegram(msg){
  const token=tokenInput.value.trim();
  const chatId=chatInput.value.trim();
  if(!token){addLog('⚠️ حط التوكن الكامل','orange');return false;}
  try{
    const res=await fetch(`https://api.telegram.org/bot${token}/sendMessage`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({chat_id:chatId,text:msg})
    });
    const d=await res.json();
    if(d.ok){addLog('✅ Telegram تم','#4ade80');return true;}
    if(d.description && d.description.includes('blocked')) addLog('❌ بلوكيت البوت! دير Unblock + Start','red');
    else addLog('❌ Telegram: '+(d.description||'توكن غلط - تأكد من التوكن كامل'),'red');
    return false;
  }catch(e){addLog('❌ خطأ Telegram: '+e.message,'red');return false;}
}

async function checkBLS(){
  count++;
  document.getElementById('count').innerText=count;
  document.getElementById('last').innerText=new Date().toLocaleTimeString();
  const blsUrl=cleanUrl(urlInput.value);
  urlInput.value=blsUrl;
  addLog(`🔍 فحص #${count} ...`);

  const proxies=[
    `https://api.allorigins.win/get?url=${encodeURIComponent(blsUrl)}`,
    `https://r.jina.ai/${blsUrl}`,
    `https://api.allorigins.win/raw?url=${encodeURIComponent(blsUrl)}`,
    `https://corsproxy.io/?url=${encodeURIComponent(blsUrl)}`,
    `https://proxy.cors.sh/${blsUrl}`
  ];

  let html="", ok=false;
  for(let p of proxies){
    try{
      const r=await fetch(p);
      if(r.ok){
        let t=await r.text();
        try{ let j=JSON.parse(t); if(j.contents) t=j.contents; }catch(e){}
        if(t.length>500){ html=t; ok=true; break; }
      }
    }catch(e){}
  }

  if(!ok){
    addLog('❌ فشل الاتصال - BLS يبلوكي الفحص','red');
    setStatus('❌ مشكلة اتصال - جاري المحاولة','err');
    return;
  }

  const low=html.toLowerCase();
  const noSlot=low.includes('no appointment')||low.includes('no slot')||low.includes('no available')||low.includes('not available')||low.includes('fully booked')||low.includes('no date');
  const hasAvailable=low.includes('available')||low.includes('book now')||low.includes('appointment available');
  const isAvailable=hasAvailable && !noSlot;

  if(isAvailable){
    setStatus('🔥 كاين موعد !!','ok');
    addLog('🔥 كاين موعد صحيح!','#4ade80');
    if(!lastNotified){
      const sent=await sendTelegram('🔥 كاين موعد BLS Oran 3 ! روح احجز: '+blsUrl);
      if(sent) lastNotified=true;
    }
  } else {
    setStatus('ℹ️ لا توجد مواعيد حاليا','');
    addLog('ℹ️ لا توجد مواعيد حاليا');
    lastNotified=false;
  }
}

function startCheck(){
  if(interval) return;
  if(!tokenInput.value.trim()){alert('حط التوكن الكامل أولا');return;}
  addLog('▶️ بدأ الفحص كل 45 ثانية','#22c55e');
  setStatus('🟢 الفحص شغال...','work');
  checkBLS();
  interval=setInterval(checkBLS,45000);
}
function stopCheck(){
  clearInterval(interval); interval=null;
  addLog('⏹️ تم الإيقاف'); setStatus('⏸️ متوقف','');
}
function testTelegram(){sendTelegram('✅ تجربة ناجحة - BLS Oran 3 يخدم');}
addLog('📱 جاهز - حط التوكن الكامل و اضغط بدء','#60a5fa');
</script>
</body>
</html>
