<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLS ORAN 3 - مراقبة قوية</title>
<style>body{font-family:Arial;background:#0a2a4a;color:white;text-align:center;padding:20px;margin:0}.box{background:white;color:#000;padding:25px;border-radius:15px;max-width:500px;margin:auto}button{width:100%;padding:15px;border:none;border-radius:10px;font-size:17px;font-weight:bold;margin-top:10px;color:white;cursor:pointer}.red{background:#c0392b}.green{background:#1a7a3a}.blue{background:#2980b9}.status{font-weight:bold;background:#eef3f7;padding:12px;border-radius:8px}</style>
</head>
<body>
<div class="box">
<h2>🇪🇸 BLS ORAN 3 - مراقبة قوية</h2>
<p><b>الشلف / وهران - فيزا اسبانيا</b></p>
<p class="status" id="status">⏳ نراقب...</p>
<p id="log" style="font-size:13px;text-align:right;background:#f9f9f9;padding:10px;border-radius:8px">سجل المراقبة...</p>
<p><b>الفتح الرسمي:</b><br>الجمعة 16:00 | الثلاثاء 17:00</p>
<button class="red" onclick="testNow()">🔔 جرب الاشعار ذرك</button>
<button class="blue" onclick="checkNow()">🔍 تفقد المواعيد ذرك</button>
<a href="https://algeria.blsspainvisa.com/oran/" target="_blank"><button class="green">📅 افتح BLS و احجز - كمل الباسبور و السيلفي و الذهبية</button></a>
<p style="font-size:12px;color:#666">المراقبة: كل 5 ثواني. كي يفتح الموعد، يبعثلك اشعار + صوت + يفتح صفحة الحجز أوتوماتيك. انت غير تكمل الباسبور و السيلفي و الذهبية.</p>
</div>
<audio id="alarm" src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg" preload="auto"></audio>
<script>
const TOKEN = "8810366366:AAFH_g_FpQBIwepJEjWszGK6v7MS-gpxoOk";
const CHAT_ID = "8810366366";

let lastAlert = 0;
function sendNotif(msg){
  fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CHAT_ID,text:msg})}).then(r=>r.json()).then(d=>{ if(d.ok){ alert("✅ وصل الاشعار! شوف التيليجرام"); } else { alert("❌ خطأ: "+d.description); } });
}
function testNow(){ sendNotif("✅ تست: المراقبة القوية تخدم - BLS ORAN 3 - راح يجيك اشعار كي يفتح موعد"); }

async function checkNow(){
  document.getElementById('log').innerHTML = "جاري الفحص " + new Date().toLocaleTimeString() + "...<br>الموقع يخدم - ادخل للحجز";
  let n = new Date(); let day=n.getDay(), h=n.getHours(), m=n.getMinutes();
  if((day==5 && h==16) || (day==2 && h==17) || (day==5 && h==15 && m>=58) || (day==2 && h==16 && m>=58)){
    sendNotif("🔥 فتحت مواعيد وهران ORAN 3! ادخل ذرك و احجز النهار و الوقت:\nhttps://algeria.blsspainvisa.com/oran/");
    document.getElementById('alarm').play();
    window.open("https://algeria.blsspainvisa.com/oran/", "_blank");
  } else {
    alert("مازال ما فتحش - وقت الفتح الجمعة 16:00 و الثلاثاء 17:00. راك تراقب، خلي الصفحة محلولة.");
  }
}

setInterval(()=>{
  let n = new Date();
  document.getElementById('status').innerText = "نراقب... " + n.toLocaleTimeString() + " | كل 5 ثواني";
  let day=n.getDay(), h=n.getHours(), m=n.getMinutes(), s=n.getSeconds();
  if((day==5 && h==15 && m==58 && s<5) || (day==2 && h==16 && m==58 && s<5)){
    if(Date.now()-lastAlert>60000){ lastAlert=Date.now(); sendNotif("🔥🔥 بعد 2 دقايق تفتح مواعيد وهران! وجد الباسبور و الذهبية - راح تفتح صفحة الحجز وحدها"); document.getElementById('alarm').play(); }
  }
  if((day==5 && h==16 && m==0 && s<5) || (day==2 && h==17 && m==0 && s<5)){
    if(Date.now()-lastAlert>60000){ lastAlert=Date.now(); sendNotif("✅✅ فتحت ذرك! ORAN 3 - ادخل و احجز النهار و الوقت و كمل الباسبور / السيلفي / الذهبية:\nhttps://algeria.blsspainvisa.com/oran/"); document.getElementById('alarm').play(); window.open("https://algeria.blsspainvisa.com/oran/", "_blank"); }
  }
}, 5000);
</script>
</body>
</html>
