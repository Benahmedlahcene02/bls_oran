<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RDV BLS Oran</title>
<style>
body{font-family:Arial;background:#f0f2f5;padding:20px}
.card{background:white;max-width:400px;margin:auto;padding:20px;border-radius:15px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
input,select,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}
button{background:#007bff;color:white;border:none;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>Réservation BLS Oran</h2>
<input id="name" placeholder="Nom complet">
<input id="tel" placeholder="Téléphone">
<input id="date" type="date">
<select id="time"><option>09:00</option><option>10:00</option><option>11:00</option><option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>16:30</option></select>
<button onclick="send()">Confirmer Rendez-vous</button>
<p id="msg"></p>
</div>
<script>
async function send(){
const name=document.getElementById('name').value;
const tel=document.getElementById('tel').value;
const date=document.getElementById('date').value;
const time=document.getElementById('time').value;
if(!name||!tel||!date){document.getElementById('msg').innerText='Remplis tout !';return;}
const text=`Nouveau RDV Oran\nNom: ${name}\nTel: ${tel}\nDate: ${date}\nHeure: ${time}`;
const url=`https://api.telegram.org/bot8810366366:AAFqb3wl6bCkYCrrsNJGSuABwRYD9VjZhRc/sendMessage`;
try{
const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:93372553,text:text})});
const data=await res.json();
if(data.ok){document.getElementById('msg').innerText='✅ Rendez-vous confirme ! Notification envoyee.';}
else{document.getElementById('msg').innerText='Erreur Telegram: '+data.description;}
}catch(e){document.getElementById('msg').innerText='Erreur réseau: '+e.message;}
}
</script>
</body>
</html>
