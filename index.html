<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Oran 3 Famille</title><style>body{font-family:Arial;background:#f0f2f5;margin:0}header{background:#0b3d91;color:#fff;padding:20px;text-align:center}.c{max-width:500px;margin:20px auto;padding:15px}.card{background:#fff;padding:20px;border-radius:16px}input,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}button{width:100%;padding:15px;background:#0b3d91;color:#fff;border:0;border-radius:12px;font-weight:700;margin-top:15px}.slots{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.slot{padding:10px;border:1px solid #ddd;text-align:center;border-radius:10px;cursor:pointer}.slot.sel{background:#0b3d91;color:#fff}.slot.taken{background:#ffe0e0;text-decoration:line-through;color:#999}</style></head><body><header><h1>Oran 3 - Famille</h1><p>Reservation Rendez-vous</p></header><div class="c"><div class="card"><input id="name" placeholder="Nom Complet"><input id="phone" placeholder="Telephone"><select id="member"><option>Famille</option><option>Pere</option><option>Mere</option><option>Fils</option><option>Fille</option></select><input id="date" type="date"><div class="slots" id="slots"></div><button onclick="book()">Confirmer Rendez-vous</button><p id="ok" style="display:none;color:green">✅ Rendez-vous confirme ! Notification envoyee.</p></div></div><script>const BOT_TOKEN='8810366366:AAFqb3wl6bCkYCrrsNJGSuABwRYD9VjZhRc';const CHAT_ID='93372553';let sel=null;const times=['09:00','09:30','10:00','10:30','11:00','11:30','14:00','14:30','15:00','15:30','16:00','16:30'];function getB(){return JSON.parse(localStorage.getItem('oran3')||'[]')}function render(){const d=document.getElementById('date').value;const taken=getB().filter(b=>b.date===d).map(b=>b.time);document.getElementById('slots').innerHTML=times.map(t=>'<div class="slot '+(taken.includes(t)?'taken':'')+' '+(sel===t?'sel':'')+'" onclick="sel=\''+t+'\';render()">'+t+'</div>').join('')}function book(){const n=document.getElementById('name').value;const p=document.getElementById('phone').value;const m=document.getElementById('member').value;const d=document.getElementById('date').value;if(!n||!p||!d||!sel){alert('Remplir tout');return}let b=getB();b.push({name:n,phone:p,member:m,date:d,time:sel});localStorage.setItem('oran3',JSON.stringify(b));fetch('https://api.telegram.org/bot'+BOT_TOKEN+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CHAT_ID,text:'Nouveau RDV Oran3 Famille\nNom: '+n+'\nTel: '+p+'\nMembre: '+m+'\nDate: '+d+'\nHeure: '+sel})});document.getElementById('ok').style.display='block';render()}document.getElementById('date').addEventListener('change',()=>{sel=null;render()});document.getElementById('date').valueAsDate=new Date();render();</script></body></html>
