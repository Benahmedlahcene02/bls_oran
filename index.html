<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>حجز موعد فيزا اسبانيا - ORAN 3 وهران</title>
<style>body{font-family:Arial;background:#0a2a4a;color:white;text-align:center;padding:20px} .box{background:white;color:#000;padding:20px;border-radius:15px;max-width:450px;margin:auto} button{width:100%;padding:14px;background:#c0392b;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin-top:15px}</style>
</head>
<body>
<div class="box">
<h2>🇪🇸 مراقب مواعيد BLS وهران</h2>
<p>ORAN 3 - الشلف / وهران</p>
<p id="status">الحالة: نراقب...</p>
<p>المواعيد تفتح:</p>
<p><b>الجمعة 16:00</b><br><b>الثلاثاء 17:00</b></p>
<button onclick="testNow()">جرب الاشعار ذرك</button>
<a href="https://algeria.blsspainvisa.com/appointment.php" target="_blank"><button style="background:#1a7a3a">روح لموقع BLS و احجز</button></a>
<p style="font-size:12px;color:#666">خلي هاذ الصفحة محلولة في التيليفون باش يجيك الاشعار</p>
</div>
<script>
const TOKEN = "حط التوكن الجديد هنا";
const CHAT_ID = "6002024244";
function sendNotif(msg){
  fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CHAT_ID,text:msg})});
}
function testNow(){ sendNotif("✅ تست الاشعار: الاشعارات راهي تخدم - BLS Oran"); alert("شوف التيليجرام ذرك"); }
setInterval(()=>{
  let n = new Date();
  let day = n.getDay();
  let h = n.getHours(); let m = n.getMinutes();
  document.getElementById('status').innerText = "الحالة: نراقب... " + n.toLocaleTimeString();
  if((day==5 && h==15 && m==58) || (day==2 && h==16 && m==58)){
    sendNotif("🔥 تنبيه BLS وهران: المواعيد راح تفتح بعد 2 دقايق! ادخل ذرك");
  }
  if((day==5 && h==16 && m==0) || (day==2 && h==17 && m==0)){
    sendNotif("✅ فتحت المواعيد ذرك في وهران! ORAN 3 - ادخل و احجز النهار و الوقت");
  }
}, 30000);
</script>
</body>
</html>
