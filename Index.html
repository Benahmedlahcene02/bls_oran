<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réservation BLS Oran</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;padding:20px}
.box{background:white;max-width:400px;margin:auto;padding:20px;border-radius:12px;box-shadow:0 0 10px #ccc}
h2{text-align:center}
label{font-weight:bold;display:block;margin-top:12px}
input{width:100%;padding:10px;margin-top:5px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;margin-top:20px;background:#1a73e8;color:white;border:none;border-radius:8px;font-size:16px;cursor:pointer}
#msg{text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h2>Réservation BLS Oran</h2>
<label>Nom</label><input id="nom" placeholder="Nom">
<label>Prénom</label><input id="prenom" placeholder="Prénom">
<label>Numéro de téléphone</label><input id="tel" placeholder="05...">
<label>Date de rendez-vous</label><input id="date" type="date" value="2026-10-29">
<label>Heure</label><input id="heure" type="time" value="10:00">
<button onclick="send()">Confirmer Rendez-vous</button>
<p id="msg"></p>
</div>
<script>
const TOKEN = "PUT_YOUR_BOT_TOKEN_HERE";
const CHAT_ID = "8810366366";
async function send(){
  const nom=document.getElementById('nom').value;
  const prenom=document.getElementById('prenom').value;
  const tel=document.getElementById('tel').value;
  const date=document.getElementById('date').value;
  const heure=document.getElementById('heure').value;
  const text = `🆕 Nouvelle Réservation BLS Oran\n\n👤 Nom: ${nom} ${prenom}\n📞 Tél: ${tel}\n📅 Date: ${date}\n🕙 Heure: ${heure}`;
  const url = `https://api.telegram.org/bot${TOKEN}/sendMessage`;
  try{
    const res = await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:CHAT_ID,text:text})});
    const data = await res.json();
    if(data.ok){document.getElementById('msg').innerText="✅ Réservation envoyée!";}
    else{document.getElementById('msg').innerText="❌ Erreur: "+data.description;}
  }catch(e){document.getElementById('msg').innerText="❌ Erreur réseau";}
}
</script>
</body>
</html>
